name: Claude Code Review
# A review-head run is named for the commit it reviewed, so readReviewerEffort can find it (M6.E18).
run-name: ${{ github.event.action == 'labeled' && format('review-head {0}', github.event.pull_request.head.sha) || github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Adding a label is not a push; the review-head job below handles the one label that asks for a review.
    if: github.event.action != 'labeled'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The review command launches parallel sub-agents and reads the PR with `gh`; with only the
          # comment tool allowed it stopped after 2 turns (~$0.10) on every PR from 2026-09-25 on —
          # 32 runs, none a real review, all reported as a pass. Allow what the command declares.
          # SIG-281: with the tools allowed, the reviewer still skipped the command's parallel review and
          # validation agents and read the diff alone — its own words on #287: "I skipped the parallel
          # review and validation agents". On #284 (227 lines) that was 5 turns, $0.16, no comment.
          # The appended instruction makes every step mandatory unless step 1 stops the review.
          # Then (#289): the agents were launched in the BACKGROUND, the reviewer ended its turn to
          # "wait for the notification", and in a CI run the end of the turn is the end of the session
          # — 3 turns, $0.17, no review. Every agent must run in the foreground.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Grep,Glob" --append-system-prompt "Run the code-review command exactly as written. Unless its step 1 check says to stop, launch every agent it names in steps 2 through 5 with the Task tool, including the four parallel review agents and the validation agents. Do not review the diff yourself in their place, and do not skip agents because the change looks small or simple. Launch every agent with run_in_background set to false so its result returns before you continue; this is a non-interactive run, so ending your turn to wait for a background agent ends the review with nothing done. Always finish by posting the review comment the command describes, even when no issues are found."'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # SIG-281: after #283 the review still stops early (5 turns, $0.16 on #284) and the log shows
      # only the result summary. Keep the reviewer's transcript for one day so the cause can be read,
      # instead of `show_full_output`, which prints it into this public repo's logs indefinitely.
      - name: Keep reviewer transcript (SIG-281)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 1
          if-no-files-found: warn

      # D-M6E18-8: the log carries no result text and the transcript artifact is kept one day, so
      # one line is written into the log (kept 90 days) for readReviewerEffort to read.
      - name: Record review outcome
        if: always()
        env:
          OUT: ${{ runner.temp }}/claude-execution-output.json
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB: review
        run: |
          node - <<'JS'
          const fs = require('fs');
          let outcome = 'no-result', turns = '', cost = '';
          try {
            const messages = JSON.parse(fs.readFileSync(process.env.OUT, 'utf8'));
            const result = [...messages].reverse().find((m) => m && m.type === 'result');
            if (result) {
              turns = String(result.num_turns ?? '');
              cost = String(result.total_cost_usd ?? '');
              outcome = /already commented/i.test(String(result.result ?? '')) ? 'stopped-step-1' : 'reviewed';
            }
          } catch {}
          console.log(`REVIEW_OUTCOME=${outcome} head=${process.env.HEAD_SHA} job=${process.env.JOB} turns=${turns} cost=${cost}`);
          JS

  # M6.E18 (SIG-348, D-M6E18-1, -8): the job above runs the upstream /code-review command, whose step 1
  # stops when Claude has already commented on the PR. So only a PR's first push is reviewed: on #304
  # the first push got 9 turns and $1.44 (run 39316819152) and each of the nine later pushes, which
  # carried every REVIEW fix round, stopped at step 1 in 2-4 turns (run 39346376038: "so I'm stopping.
  # I did not review it"). This job reviews the PR's head commit on demand. Add the `review-head` label
  # to ask; to ask again, remove it and add it again. The prompt is the upstream command's steps 2-9,
  # copied from anthropics/claude-code at db8834ba1d72e9a26fba30ac85f3bc4316bb0689
  # (plugins/code-review/commands/code-review.md), without step 1. Its eligibility check is the stop
  # this job exists to get past, and an instruction telling the command to ignore its own step would
  # be a fourth prompt patch on this workflow (SIG-281 took three). Re-copy from upstream when it
  # changes. Same permissions and tools as the job above; it does not remove its own label, which
  # would need pull-requests: write.
  review-head:
    if: github.event.action == 'labeled' && github.event.label.name == 'review-head'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the head commit
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Grep,Glob" --append-system-prompt "Run every step of the review below exactly as written. Launch every agent it names in steps 2 through 5 with the Task tool, including the four parallel review agents and the validation agents. Do not review the diff yourself in their place, and do not skip agents because the change looks small or simple. Launch every agent with run_in_background set to false so its result returns before you continue; this is a non-interactive run, so ending your turn to wait for a background agent ends the review with nothing done. Always finish by posting the review comment the steps describe, even when no issues are found."'
          prompt: |
            Provide a code review for pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}, at its head commit ${{ github.event.pull_request.head.sha }}. The --comment argument IS provided.

            This review was asked for on purpose, by a person adding the review-head label. Review it even if an earlier review exists; the upstream eligibility check is deliberately not part of these steps.

            **Agent assumptions (applies to all agents and subagents):**
            - All tools are functional and will work without error. Do not test tools or make exploratory calls. Make sure this is clear to every subagent that is launched.
            - Only call a tool if it is required to complete the task. Every tool call should have a clear purpose.

            To do this, follow these steps precisely:

            2. Launch a haiku agent to return a list of file paths (not their contents) for all relevant CLAUDE.md files including:
               - The root CLAUDE.md file, if it exists
               - Any CLAUDE.md files in directories containing files modified by the pull request

            3. Launch a sonnet agent to view the pull request and return a summary of the changes

            4. Launch 4 agents in parallel to independently review the changes. Each agent should return the list of issues, where each issue includes a description and the reason it was flagged (e.g. "CLAUDE.md adherence", "bug"). The agents should do the following:

               Agents 1 + 2: CLAUDE.md compliance sonnet agents
               Audit changes for CLAUDE.md compliance in parallel. Note: When evaluating CLAUDE.md compliance for a file, you should only consider CLAUDE.md files that share a file path with the file or parents.

               Agent 3: Opus bug agent (parallel subagent with agent 4)
               Scan for obvious bugs. Focus only on the diff itself without reading extra context. Flag only significant bugs; ignore nitpicks and likely false positives. Do not flag issues that you cannot validate without looking at context outside of the git diff.

               Agent 4: Opus bug agent (parallel subagent with agent 3)
               Look for problems that exist in the introduced code. This could be security issues, incorrect logic, etc. Only look for issues that fall within the changed code.

               **CRITICAL: We only want HIGH SIGNAL issues.** Flag issues where:
               - The code will fail to compile or parse (syntax errors, type errors, missing imports, unresolved references)
               - The code will definitely produce wrong results regardless of inputs (clear logic errors)
               - Clear, unambiguous CLAUDE.md violations where you can quote the exact rule being broken

               Do NOT flag:
               - Code style or quality concerns
               - Potential issues that depend on specific inputs or state
               - Subjective suggestions or improvements

               If you are not certain an issue is real, do not flag it. False positives erode trust and waste reviewer time.

               In addition to the above, each subagent should be told the PR title and description. This will help provide context regarding the author's intent.

            5. For each issue found in the previous step by agents 3 and 4, launch parallel subagents to validate the issue. These subagents should get the PR title and description along with a description of the issue. The agent's job is to review the issue to validate that the stated issue is truly an issue with high confidence. For example, if an issue such as "variable is not defined" was flagged, the subagent's job would be to validate that is actually true in the code. Another example would be CLAUDE.md issues. The agent should validate that the CLAUDE.md rule that was violated is scoped for this file and is actually violated. Use Opus subagents for bugs and logic issues, and sonnet agents for CLAUDE.md violations.

            6. Filter out any issues that were not validated in step 5. This step will give us our list of high signal issues for our review.

            7. Output a summary of the review findings to the terminal:
               - If issues were found, list each issue with a brief description.
               - If no issues were found, state: "No issues found. Checked for bugs and CLAUDE.md compliance."

               If `--comment` argument was NOT provided, stop here. Do not post any GitHub comments.

               If `--comment` argument IS provided and NO issues were found, post a summary comment using `gh pr comment` and stop.

               If `--comment` argument IS provided and issues were found, continue to step 8.

            8. Create a list of all comments that you plan on leaving. This is only for you to make sure you are comfortable with the comments. Do not post this list anywhere.

            9. Post inline comments for each issue using `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`. For each comment:
               - Provide a brief description of the issue
               - For small, self-contained fixes, include a committable suggestion block
               - For larger fixes (6+ lines, structural changes, or changes spanning multiple locations), describe the issue and suggested fix without a suggestion block
               - Never post a committable suggestion UNLESS committing the suggestion fixes the issue entirely. If follow up steps are required, do not leave a committable suggestion.

               **IMPORTANT: Only post ONE comment per unique issue. Do not post duplicate comments.**

            Use this list when evaluating issues in Steps 4 and 5 (these are false positives, do NOT flag):

            - Pre-existing issues
            - Something that appears to be a bug but is actually correct
            - Pedantic nitpicks that a senior engineer would not flag
            - Issues that a linter will catch (do not run the linter to verify)
            - General code quality concerns (e.g., lack of test coverage, general security issues) unless explicitly required in CLAUDE.md
            - Issues mentioned in CLAUDE.md but explicitly silenced in the code (e.g., via a lint ignore comment)

            Notes:

            - Use gh CLI to interact with GitHub (e.g., fetch pull requests, create comments). Do not use web fetch.
            - Create a todo list before starting.
            - You must cite and link each issue in inline comments (e.g., if referring to a CLAUDE.md, include a link to it).
            - If no issues are found and `--comment` argument is provided, post a comment with the following format:

            ---

            ## Code review

            No issues found. Checked for bugs and CLAUDE.md compliance.

            ---

            - When linking to code in inline comments, follow the following format precisely, otherwise the Markdown preview won't render correctly: https://github.com/anthropics/claude-code/blob/c21d3c10bc8e898b7ac1a2d745bdc9bc4e423afe/package.json#L10-L15
              - Requires full git sha
              - You must provide the full sha. Commands like `https://github.com/owner/repo/blob/$(git rev-parse HEAD)/foo/bar` will not work, since your comment will be directly rendered in Markdown.
              - Repo name must match the repo you're code reviewing
              - # sign after the file name
              - Line range format is L[start]-L[end]
              - Provide at least 1 line of context before and after, centered on the line you are commenting about (eg. if you are commenting about lines 5-6, you should link to `L4-7`)

      - name: Keep reviewer transcript (SIG-281)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-head-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 1
          if-no-files-found: warn

      # D-M6E18-8: the log carries no result text and the transcript artifact is kept one day, so
      # one line is written into the log (kept 90 days) for readReviewerEffort to read.
      - name: Record review outcome
        if: always()
        env:
          OUT: ${{ runner.temp }}/claude-execution-output.json
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB: review-head
        run: |
          node - <<'JS'
          const fs = require('fs');
          let outcome = 'no-result', turns = '', cost = '';
          try {
            const messages = JSON.parse(fs.readFileSync(process.env.OUT, 'utf8'));
            const result = [...messages].reverse().find((m) => m && m.type === 'result');
            if (result) {
              turns = String(result.num_turns ?? '');
              cost = String(result.total_cost_usd ?? '');
              outcome = /already commented/i.test(String(result.result ?? '')) ? 'stopped-step-1' : 'reviewed';
            }
          } catch {}
          console.log(`REVIEW_OUTCOME=${outcome} head=${process.env.HEAD_SHA} job=${process.env.JOB} turns=${turns} cost=${cost}`);
          JS
